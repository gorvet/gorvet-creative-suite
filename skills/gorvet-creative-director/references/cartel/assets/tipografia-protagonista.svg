<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800" role="img" aria-labelledby="title desc"><title id="title">Tipografía protagonista</title><desc id="desc">Un mensaje grande y otro subordinado, con datos prácticos de menor escala.</desc><rect x="0" y="0" width="600" height="800" fill="#f6f3ed"/><text x="40" y="65" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#212b36" >B · El mensaje crea la forma</text><text x="40" y="240" font-family="Arial, sans-serif" font-size="112" font-weight="700" fill="#212b36" >Idea</text><text x="40" y="360" font-family="Arial, sans-serif" font-size="98" font-weight="700" fill="#2e6271" >principal</text><text x="40" y="445" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#212b36" >Una razón para comprenderla</text><rect x="40" y="563" width="520" height="2" fill="#afb6b8"/><text x="40" y="613" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#212b36" >Datos de consulta</text><text x="40" y="658" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#212b36" >Información práctica relacionada</text><text x="40" y="707" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#212b36" >Siguiente paso</text><text x="40" y="770" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#596472" >GORVET · Esquema analítico, no plantilla</text></svg>
